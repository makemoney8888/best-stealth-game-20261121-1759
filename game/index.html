<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lantern's Shadow — a top-down stealth game</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #0b120f; }
  body { display: flex; align-items: center; justify-content: center; }
  #game { display: block; touch-action: none; max-width: 100vw; max-height: 100vh; }
  /* Read aloud, never shown: the status line screen readers announce. */
  #status { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
</style>
</head>
<body>
<canvas id="game" aria-label="Lantern's Shadow: a top-down stealth game. Move with WASD or arrow keys, or click to walk. Avoid the guards' vision cones and reach the glowing exit."></canvas>
<p id="status" role="status" aria-live="polite"></p>
<script type="module" src="./src/main.js"></script>
</body>
</html>
